spring.application.name=r24-automotive-backend

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.port=8080

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# JWT signing secret + admin login credentials. ADMIN_PASSWORD_HASH is a
# BCrypt hash, not the plaintext password — generate it once and store only
# the hash (see PasswordHashGenerator).
jwt.secret=${JWT_SECRET}
app.admin.username=${ADMIN_USERNAME}
app.admin.password-hash=${ADMIN_PASSWORD_HASH}

# Error alert emails — sent by ErrorAlertService whenever an unhandled
# exception reaches GlobalExceptionHandler. ALERT_MAIL_USERNAME/PASSWORD
# must be set as env vars (a Gmail App Password, not the account password).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${ALERT_MAIL_USERNAME:}
spring.mail.password=${ALERT_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.alert.to=${ALERT_MAIL_TO:jangilisai25@gmail.com}
app.alert.enabled=${ALERT_MAIL_ENABLED:false}